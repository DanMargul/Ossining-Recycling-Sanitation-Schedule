<style>
  html,body{margin:0;height:100%;background:#f7f5f0;overflow:hidden;

  .nohud #hud{display:none}

const TIERS={"albany-post-road":1,"south-highland-ave":1,"croton-avenue":1,"spring-street":1,"north-highland-ave":1,"cedar-lane":1,"revolutionary-road":1,"state-street":1,"water-street":1,"pleasantville-road":1,"main-street":1,"campwoods-road":1,"broadway":1,"underhill-road":1,"ryder-road":1,"dale-avenue":1,"narragansett-ave":1,"havell-street":1,"snowden-avenue":1,"pine-avenue":1,"linden-avenue":1,"ferris-place":1,"charter-circle":1,"pocantico-road":1,"park-avenue":1,"hunter-street":1,"beach-road":1,"donald-lane":1,"stone-avenue":1,"sherwood-avenue":1,"meadowbrook-drive":1,"iroquoise-road":1,"van-cortlandt-avenue":1,"hudson-street":1,"audubon-drive":1,"sunset-drive":1,"mystic-drive":1,"watson-avenue":1,"piping-rock-drive":1,"lincoln-avenue":1,"first-avenue":1,"prospect-avenue":1,"north-malcolm-st":1,"ellis-place":1,"orchard-drive":1,"william-street":1,"belleview-avenue":1,"central-avenue":1,"wolden-road-b":1,"eastern-avenue":1,"calam-avenue":1,"ramapo-road":1,"yale-avenue":1,"lafayette-avenue":1,"forest-avenue":1,"elizabeth-street":1,"broad-avenue":1,"terrace-avenue":1,"briarcliff-drive-south":1,"everett-avenue":1,"acker-avenue":1,"kemeys-avenue":1,"priestly-street":1,"overton-road":1,"flavelle-place":1,"belle-avenue":1,"secor-road":1,"park-drive":1,"eldridge-avenue":1,"liberty-street":1,"osage-drive-east":1,"wolden-road-a":1,"agate-avenue":1,"ann-street":1,"lincoln-places":1,"quimby-street":1,"oakbrook-road":1,"brandreth-street":1,"seneca-road":1,"hamilton-avenue":1,"eagle-bay-drive":1,"murray-lane":1,"martin-road":1,"yates-avenue":1,"mohawk-road":1,"gilbert-park":1,"noel-drive":1,"jenkins-court":1,"collyer-drive":1,"high-ridge-road":1,"cedar-place":1,"todd-place":1,"croton-dam-road":1,"vista-court":1,"grandview-avenue":1,"robin-street":1,"scarborough-circle":1,"croton-street":1,"academy-place":1,"yerks-lane":1,"denny-street":1,"smith-drive":1,"hill-street":1,"westerly-road":1.5,"browning-drive":1.5,"pershing-avenue":1.5,"north-water-street":1.5,"justamere-drive":1.5,"washington-avenue":1.5,"sandy-drive":1.5,"emwilton-place":1.5,"maurice-avenue":1.5,"susquehanna-road":1.5,"mohegan-road":1.5,"ogden-road":1.5,"sabrina-lane":1.5,"briarbrook-road":1.5,"maple-place":1.5,"john-street":1.5,"marble-place":1.5,"charles-place":1.5,"palmer-place":1.5,"tompkins-avenue":1.5,"pond-view-lane":1.5,"pinebrook-road":1.5,"bradshaw-drive":1.5,"terrich-court":1.5,"hillside-terrace":1.5,"james-street":2,"brookville-avenue":2,"westview-avenue":2,"glen-street":2,"fairview-place":2,"still-court":2,"stephen-place":2,"dogwood-lane":2,"south-street":2,"geneva-road":2,"finnegan-place":2,"upper-croton-ave":3,"lee-avenue":3,"ward-place":3,"montgomery-street":3,"birchbrook-road":3,"fuller-road":3,"birch-court":3,"van-wyck-street":3,"barlow-lane":3,"brooke-club-drive":3,"pugsley-place":3,"prospect-place":3,"davids-lane":3,"brook-place":3,"broad-street":3,"aqueduct-street":4.5,"waller-avenue":4.5,"sherman-place":4.5,"marshall-place":4.5,"madison-avenue":4.5,"steven-drive":4.5,"independence-place":4.5,"spencer-place":4.5,"butler-place":4.5,"st-paul-s-place":4.5,"garden-street":4.5,"riverview-court":4.5,"sarah-street":4.5,"south-water-st":4.5,"second-avenue":7,"osage-drive-west":7,"hudson-point-lane":7,"gates-avenue":7,"leonard-street":7,"nelson-avenue":7,"cortlandt-place":7,"spaulding-place":7,"church-street":7,"willow-street":7,"edwards-street":10,"oak-hill-terrace":10,"ridgewood-avenue":10,"matilda-street":10,"robert-place":10,"navajo-lane":10,"clinton-avenue":15,"cedar-lane-terrace":15,"hudson-view-hill":15,"churchill-street":15,"sutton-place":22,"market-street":33,"south-malcolm-street":33,"liberty-knolls":33,"mundet-drive":33,"first-street":33,"amawalk-court":33,"americo-circle":75,"knoll-view":110}, GROWTH=0.55;
const SW=3.2, QW=2.0, BW=1.2;   // base stroke widths, in screen px at 1x
const SG=0.45;                  // street growth exponent, relative to label growth
const SWMAX=15;                 // ceiling so lines never become blobs
const svg=document.getElementById('map');
const labels=[...document.querySelectorAll('.lbl')];
let vb={x:0,y:0,w:W,h:H};

function apply(){
  svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const k=W/vb.w;
  const size=FS*Math.pow(k,GROWTH);        // on-screen px
  const mapSize=size/k;                    // map units
  // streets thicken too, but on a gentler curve and with a ceiling
  const sk=Math.min(Math.pow(k, GROWTH*SG*2), SWMAX/SW);
  const st=svg.style;
  st.setProperty('--cw',(1.1*sk/k)+'px');
  st.setProperty('--rw',(2.6*sk/k)+'px');
  st.setProperty('--rt',(1.4*sk/k)+'px');
  st.setProperty('--rd',(1.6*sk/k)+'px '+(3.2*sk/k)+'px');
  for(const t of document.querySelectorAll('.wt')){
    t.style.fontSize=(mapSize*1.15)+'px';
  }
  for(const t of document.querySelectorAll('.lmt')){
    t.style.fontSize=(mapSize*0.82)+'px';
    t.style.strokeWidth=(mapSize*0.2)+'px';
  }
  st.setProperty('--sw',(SW*sk/k)+'px');
  st.setProperty('--qw',(QW*sk/k)+'px');
  st.setProperty('--bw',(BW*sk/k)+'px');
  st.setProperty('--qd',(5*sk/k)+'px '+(4*sk/k)+'px');
  st.setProperty('--bd',(3*sk/k)+'px '+(4*sk/k)+'px');
  for(const t of labels){
    const mz=TIERS[t.dataset.id];
    const forced=t.classList.contains('picked');
    if(!forced && (mz===undefined || k<mz)){ t.classList.add('hide'); continue; }
    t.classList.remove('hide');
    t.style.fontSize=mapSize+'px';
    t.style.strokeWidth=(mapSize*0.27)+'px';
  }
}

// legend click -> show/hide that category's street paths and its labels together
document.querySelectorAll('.k').forEach(key=>{
  key.addEventListener('click',()=>{
    const off=key.classList.toggle('off');
    document.querySelectorAll('.d-'+key.dataset.cls)
      .forEach(el=>{ el.style.display = off ? 'none' : ''; });
  });
});
function clamp(){
  vb.x=Math.max(-W*.15,Math.min(W*1.15-vb.w,vb.x));
  vb.y=Math.max(-H*.15,Math.min(H*1.15-vb.h,vb.y));
}
function zoomAt(cx,cy,f){
  const nw=Math.min(W,Math.max(W/250,vb.w*f)), nh=nw*(H/W);
  const rx=(cx-vb.x)/vb.w, ry=(cy-vb.y)/vb.h;
  vb={x:cx-rx*nw,y:cy-ry*nh,w:nw,h:nh}; clamp(); apply();
}
function pt(e){
  const r=svg.getBoundingClientRect();
  return [vb.x+(e.clientX-r.left)/r.width*vb.w, vb.y+(e.clientY-r.top)/r.height*vb.h];
}
svg.addEventListener('wheel',e=>{e.preventDefault();const[x,y]=pt(e);
  zoomAt(x,y,e.deltaY>0?1.15:1/1.15);},{passive:false});
// one pointer pans, two pointers pinch; a tap that barely moved picks a street
const ptrs=new Map();
let drag=null, pinch=0, tap=null;
const spread=()=>{const[a,b]=[...ptrs.values()];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);};
svg.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,e);
  svg.setPointerCapture(e.pointerId);svg.classList.add('drag');
  if(ptrs.size===2){drag=null;tap=null;pinch=spread();}
  else{drag=pt(e);tap=[e.clientX,e.clientY];}});
svg.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,e);
  if(tap&&Math.hypot(e.clientX-tap[0],e.clientY-tap[1])>5)tap=null;
  if(pinch&&ptrs.size===2){const d=spread(),[a,b]=[...ptrs.values()];
    const[x,y]=pt({clientX:(a.clientX+b.clientX)/2,clientY:(a.clientY+b.clientY)/2});
    zoomAt(x,y,pinch/d);pinch=d;return;}
  if(!drag)return;const[x,y]=pt(e);
  vb.x-=x-drag[0];vb.y-=y-drag[1];clamp();apply();});
function release(e){ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch=0;
  if(!ptrs.size){drag=null;svg.classList.remove('drag');
    if(tap&&e.type==='pointerup')pickAt(e.clientX,e.clientY);tap=null;}}
svg.addEventListener('pointerup',release);
svg.addEventListener('pointercancel',release);
svg.addEventListener('dblclick',e=>{const[x,y]=pt(e);zoomAt(x,y,1/1.8);});

// --- embedding: a host page (the ossining.info homepage) drives the map ---
// URL hash options: hud=0 hides the legend, only=mon-thu|tue-fri fades the
// other zone and the labels, static=1 turns off pan/zoom.
const opts=Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
if(opts.hud==='0')document.body.classList.add('nohud');
if(opts.only)svg.dataset.only=opts.only;
if(opts.static==='1')svg.classList.add('static');
const paths=[...document.querySelectorAll('.street')];
const info=p=>({street:p.dataset.street,day:p.dataset.day,notes:p.dataset.notes||''});
function mark(hits){
  document.querySelectorAll('.picked').forEach(el=>el.classList.remove('picked'));
  for(const p of hits){p.classList.add('picked');
    const t=document.querySelector(`.lbl[data-id="${p.id}"]`);if(t)t.classList.add('picked');}
  svg.classList.toggle('picking',hits.length>0);apply();
}
function glide(to){                       // ease the viewBox to a new rectangle
  const from={...vb},t0=performance.now();
  (function step(now){const s=Math.min(1,(now-t0)/380),e=1-Math.pow(1-s,3);
    for(const k in vb)vb[k]=from[k]+(to[k]-from[k])*e;apply();
    if(s<1)requestAnimationFrame(step);})(t0);
}
function pickAt(cx,cy){                   // streets are thin: search a small ring
  for(const r of [0,4,8,12])for(const[dx,dy]of[[0,0],[r,0],[-r,0],[0,r],[0,-r]]){
    const p=document.elementsFromPoint(cx+dx,cy+dy).find(el=>el.classList.contains('street'));
    if(p){const same=paths.filter(q=>q.dataset.street===p.dataset.street&&q.dataset.day===p.dataset.day);
      mark(same);if(window.ossMap.onpick)window.ossMap.onpick(info(p));return;}
  }
}
window.ossMap={
  streets:()=>paths.map(info),
  focus(name){                            // highlight every segment of a street and fit it in view
    const hits=paths.filter(p=>p.dataset.street===name);
    mark(hits);if(!hits.length)return [];
    let x0=1/0,y0=1/0,x1=-1/0,y1=-1/0;
    for(const p of hits){const b=p.getBBox();
      x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height);}
    const w=Math.max(W/10,(x1-x0)*1.8,(y1-y0)*1.8*W/H),h=w*H/W;
    glide({x:(x0+x1)/2-w/2,y:(y0+y1)/2-h/2,w,h});
    return hits.map(info);
  },
  reset(){mark([]);glide({x:0,y:0,w:W,h:H});},
  onpick:null
};
apply();
</script></body></html>
