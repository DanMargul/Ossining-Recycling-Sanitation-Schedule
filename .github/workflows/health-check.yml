name: Health check

on:
  schedule:
    - cron: "43 11 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install icalendar
      - run: python check_published_feeds.py "${{ vars.SITE_URL }}" --warnings-are-failures
